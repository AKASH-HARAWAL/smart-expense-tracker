<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Smart Expense Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h1 class="text-center text-primary mb-4">
            Smart Expense Tracker 💰
        </h1>
        
        <div class="text-end mb-3">
    <a href="/logout" class="btn btn-outline-danger">Logout</a>
</div>
        
        <div class="row text-center mb-4">

    <div class="col-md-4">
        <div class="card bg-success text-white p-3">
            <h5>Total Expense</h5>
            <h3>₹ <span th:text="${total}"></span></h3>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card bg-info text-white p-3">
            <h5>Total Entries</h5>
            <h3 th:text="${count}"></h3>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card bg-primary text-white p-3">
            <h5>Project Status</h5>
            <h3>Active</h3>
        </div>
    </div>

</div>

<div class="card shadow p-4 mb-4">

    <h2 class="text-center mb-3">
        Category-wise Expense Chart
    </h2>

    <div style="width: 300px; margin: auto;">
    <canvas id="categoryChart"></canvas>
</div>

</div>

<form action="/filter" method="get" class="mb-4">

    <div class="row">

        <div class="col-md-4">

            <select name="category" class="form-control">

                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Education">Education</option>
                <option value="Other">Other</option>

            </select>

        </div>

        <div class="col-md-2">

            <button type="submit" class="btn btn-primary">
                Filter
            </button>

        </div>

        <div class="col-md-2">

            <a href="/" class="btn btn-secondary">
                Reset
            </a>

        </div>

    </div>

</form>

<a href="/download" class="btn btn-outline-primary mb-3">
    Download PDF Report
</a>

        <form action="/addExpense" method="post">

            <div class="mb-3">
                <label class="form-label">Title</label>
                <input type="text" name="title" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Amount</label>
                <input type="number" name="amount" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Category</label>
                <select name="category" class="form-control" required>
                    <option value="">Select Category</option>
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Bills">Bills</option>
                    <option value="Education">Education</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <button type="submit" class="btn btn-success w-100">
                Add Expense
            </button>

        </form>

    </div>

    <div class="card shadow mt-5 p-4">

        <h2 class="mb-3">Expense List</h2>

        <table class="table table-bordered table-hover">

            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Amount</th>
                    <th>Category</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="expense : ${expenses}">

                    <td th:text="${expense.id}"></td>
                    <td th:text="${expense.title}"></td>
                    <td th:text="${expense.amount}"></td>
                    <td th:text="${expense.category}"></td>

                    <td>

    <a th:href="@{/edit/{id}(id=${expense.id})}"
       class="btn btn-warning btn-sm">
        Edit
    </a>

    <a th:href="@{/delete/{id}(id=${expense.id})}"
       class="btn btn-danger btn-sm">
        Delete
    </a>

</td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    const food = 20;
    const travel = 0;
    const shopping = 60;
    const bills = 0;
    const education = 20;
    const other = 0;

    const ctx = document.getElementById('categoryChart');

    new Chart(ctx, {
        type: 'pie',
        data: {
            labels: ['Food', 'Travel', 'Shopping', 'Bills', 'Education', 'Other'],
            datasets: [{
                data: [food, travel, shopping, bills, education, other]
            }]
        }
    });
</script>

</body>
</html>
